<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      width: 360px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #eee;
    }
    h1 {
      font-size: 16px;
      margin-bottom: 12px;
      color: #D4AF7A;
    }
    .status {
      padding: 8px 12px;
      border-radius: 6px;
      margin-bottom: 12px;
      font-size: 13px;
    }
    .status.connected {
      background: rgba(76, 175, 80, 0.2);
      border: 1px solid #4CAF50;
      color: #81C784;
    }
    .status.disconnected {
      background: rgba(244, 67, 54, 0.2);
      border: 1px solid #F44336;
      color: #E57373;
    }
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }
    .tab {
      flex: 1;
      padding: 8px;
      border: 1px solid #333;
      background: transparent;
      color: #888;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      transition: all 0.2s;
    }
    .tab:hover {
      border-color: #555;
      color: #aaa;
    }
    .tab.active {
      background: #D4AF7A;
      color: #1a1a2e;
      border-color: #D4AF7A;
      font-weight: 600;
    }
    .panel {
      display: none;
    }
    .panel.active {
      display: block;
    }
    .info {
      font-size: 12px;
      color: #888;
      margin-bottom: 12px;
      line-height: 1.5;
    }
    textarea {
      width: 100%;
      height: 120px;
      padding: 10px;
      border: 1px solid #333;
      border-radius: 6px;
      background: #0d0d1a;
      color: #eee;
      font-family: monospace;
      font-size: 11px;
      resize: vertical;
      margin-bottom: 12px;
    }
    textarea:focus {
      outline: none;
      border-color: #D4AF7A;
    }
    textarea::placeholder {
      color: #555;
    }
    input[type="text"] {
      width: 100%;
      padding: 10px;
      border: 1px solid #333;
      border-radius: 6px;
      background: #0d0d1a;
      color: #eee;
      font-size: 13px;
      margin-bottom: 12px;
    }
    input[type="text"]:focus {
      outline: none;
      border-color: #D4AF7A;
    }
    input[type="text"]::placeholder {
      color: #555;
    }
    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #D4AF7A;
      color: #1a1a2e;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:hover {
      opacity: 0.9;
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .log {
      margin-top: 12px;
      padding: 8px;
      background: #0d0d1a;
      border-radius: 6px;
      font-size: 11px;
      max-height: 100px;
      overflow-y: auto;
      font-family: monospace;
    }
    .log-entry {
      padding: 2px 0;
      border-bottom: 1px solid #222;
    }
    .log-entry:last-child {
      border-bottom: none;
    }
    .log-entry.success { color: #81C784; }
    .log-entry.error { color: #E57373; }
    .log-entry.info { color: #64B5F6; }
  </style>
</head>
<body>
  <h1>🚀 Rork Downloader</h1>
  
  <div id="status" class="status disconnected">
    Checking server...
  </div>
  
  <div class="tabs">
    <button class="tab active" data-tab="auto">Auto Capture</button>
    <button class="tab" data-tab="manual">Paste JSON</button>
  </div>
  
  <div id="panel-auto" class="panel active">
    <p class="info">
      Navigate to a rork.com project page. The extension will automatically capture the project data when it loads.
    </p>
    <input type="text" id="folderNameAuto" placeholder="Folder name (optional - uses snapshot ID if empty)">
    <button id="captureBtn" disabled>Capture Project</button>
  </div>
  
  <div id="panel-manual" class="panel">
    <p class="info">
      Copy the JSON response from the Network tab (project.fetchSnapshot) and paste it below:
    </p>
    <input type="text" id="folderNameManual" placeholder="Folder name (optional - uses snapshot ID if empty)">
    <textarea id="jsonInput" placeholder='Paste the full JSON response here...
{
  "result": {
    "data": {
      "json": {
        "snapshot": { ... }
      }
    }
  }
}'></textarea>
    <button id="processBtn" disabled>Process JSON</button>
  </div>
  
  <div id="log" class="log"></div>

  <script src="popup.js"></script>
</body>
</html>
